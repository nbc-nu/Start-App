<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Start App</title>
    <script>
        window.onload = function() {
            const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

            if (isPWA) {
                window.open('', '_self').close();
                window.close();

                setTimeout(function() {
                    document.open();
                    document.write('');
                    document.close();
                }, 50);
            } else {
                console.log("Please install PWA to work.");
            }
        };
    </script>
</head>
<body style="background: #ffffff; font-family: sans-serif; padding: 20px;">

    <h1>Start App</h1>
    <p>Please install Start App PWA</p>
    <p>to use, create an rotine and select if the PWA is open.</p>

</body>
</html>
