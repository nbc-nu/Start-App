<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Impede zoom e interações indesejadas na tela vazia -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Start App</title>
  
  <!-- Força o modo app em tela cheia sem barras do navegador -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  
  <link rel="manifest" href="manifest.json?v=10">
  <style>
    /* Tela 100% limpa, preta e sem barras de rolagem */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      user-select: none; /* Impede seleção de texto acidental */
      -webkit-user-select: none;
    }
  </style>
</head>
<body>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=10', { scope: './' })
          .then(reg => console.log('PWA Iniciado com sucesso.'))
          .catch(err => console.error('Erro:', err));
      });
    }
  </script>
</body>
</html>
